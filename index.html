<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICD-10 Code Prediction</title>
    <link rel="icon" href="https://raw.githubusercontent.com/gramener/assets/main/straive-favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script src="script.js" defer></script>
    <style>
        .spinner-border {
            display: none;
        }
        #results-table, #summary-table {
            display: none;
        }
        .narrative {
            max-width: 40rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href=".">ICD-10 Code Prediction</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <div class="nav-item dropdown ms-auto" role="group" aria-label="Toggle dark mode" title="Toggle Dark Mode">
              <button class="dark-theme-toggle btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Toggle theme (auto)">
                <i class="bi bi-circle-half"></i> <span class="d-lg-none ms-2">Toggle theme</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li><button class="dropdown-item" data-bs-theme-value="light"><i class="me-2 bi bi-sun-fill"></i> Light</button></li>
                <li><button class="dropdown-item" data-bs-theme-value="dark"><i class="me-2 bi bi-moon-stars-fill"></i> Dark</button></li>
                <li><button class="dropdown-item" data-bs-theme-value="auto"><i class="me-2 bi bi-circle-half"></i> Auto</button></li>
              </ul>
            </div>
          </div>
        </div>
    </nav>

    <div class="container-fluid">
        <h1 class="display-1 my-4 text-center">ICD-10 Code Prediction</h1>
        <h2 class="display-6 text-center">Evaluate LLM Performance on Medical Coding</h2>
        
        <div class="card mb-4 mx-auto narrative">
            <div class="card-header">
                Configuration
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="api-token" class="form-label d-flex justify-content-between">
                        <span>LLM Foundry API Token<span class="text-danger"> *</span></span>
                        <a href="https://llmfoundry.straive.com/code" target="_blank" rel="noopener">Get token <i class="bi bi-box-arrow-up-right"></i></a>
                    </label>
                    <input type="password" class="form-control" id="api-token" placeholder="Enter your LLM Foundry API token" required>
                </div>
                <div class="mb-3">
                    <label for="csv-file" class="form-label">Upload ICD-10 Dataset (Excel file)</label>
                    <input class="form-control" type="file" id="csv-file" accept=".xlsx,.xls">
                </div>
                <div class="mb-3">
                    <label for="sample-size" class="form-label">Sample Size</label>
                    <input type="number" class="form-control" id="sample-size" value="5" min="1" max="100">
                    <small class="text-muted">Recommended: Start with small samples to avoid excessive API calls</small>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Select Models to Evaluate</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="use-gpt4" checked>
                        <label class="form-check-label" for="use-gpt4">
                            <i class="bi bi-robot"></i> GPT-4o-mini
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="use-claude" checked>
                        <label class="form-check-label" for="use-claude">
                            <i class="bi bi-robot"></i> Claude 3.7 Sonnet
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="use-gemini" checked>
                        <label class="form-check-label" for="use-gemini">
                            <i class="bi bi-robot"></i> Gemini 2.0 Flash
                        </label>
                    </div>
                </div>
                
                <div class="text-center">
                    <button id="start-evaluation" class="btn btn-primary">
                        <i class="bi bi-play-fill"></i> Start Evaluation
                    </button>
                    <div class="d-flex justify-content-center mt-3">
                        <div class="spinner-border" role="status" id="loading-spinner">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    <div id="status" class="mt-3"></div>
                </div>
            </div>
        </div>
        
        <div class="card mb-4 mx-auto narrative d-none" id="summary-card">
            <div class="card-header">
                Summary Results
            </div>
            <div class="card-body">
                <table class="table table-striped" id="summary-table">
                    <thead>
                        <tr>
                            <th>Model</th>
                            <th>Total Samples</th>
                            <th>Exact Matches</th>
                            <th>Total Score</th>
                        </tr>
                    </thead>
                    <tbody id="summary-body">
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="card mx-auto d-none" id="results-card">
            <div class="card-header">
                Detailed Results
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped" id="results-table">
                        <thead id="results-header">
                            <!-- Will be populated dynamically -->
                        </thead>
                        <tbody id="results-body">
                            <!-- Will be populated dynamically -->
                        </tbody>
                    </table>
                </div>
                <div class="text-center mt-3">
                    <button id="export-results" class="btn btn-success" style="display: none;">
                        <i class="bi bi-download"></i> Export Results to CSV
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="my-5 vh-100 d-flex align-items-center justify-content-center">
        <h1 class="display-4">Designed by <a href="https://gramener.com/" class="text-reset link-offset-3 link-underline link-underline-opacity-25">Gramener</a></h1>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@gramex/ui@0.3/dist/dark-theme.js" type="module"></script>
</body>
</html>
